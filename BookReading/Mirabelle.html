el in zijn yoghurt.", "mp3": "./Mirabelle/page 08-05.mp3"}, {"text": "'I hope you haven't put any spiders in", "text_nl": "'Ik hoop dat je geen spinnen erin hebt gedaan'", "mp3": "./Mirabelle/page 08-06.mp3"}]}, {"jpegname": "page 09.jpeg", "text": "MY breakfast!' he said. 'You know I'm a vegetarian! This is really disgraceful behavior Mirabelle. I'm hoping for better from you this year at Witch School.'\n\nBy half past eight Wilbur and I were ready by the front door with our broomsticks.", "mp3": "./Mirabelle/page 09.mp3", "text_nl": "'MIJN ontbijt!' zei hij. 'Je weet dat ik vegetariër ben! Dit is echt schandalig gedrag, Mirabelle. Ik hoop dit jaar op beter gedrag van je op de Heksenschool.'\n\nOm half negen waren Wilbur en ik klaar bij de voordeur met onze bezems.", "sentences": [{"text": "MY breakfast!' he said.", "text_nl": "MIJN ontbijt!' zei hij.", "mp3": "./Mirabelle/page 09-01.mp3"}, {"text": "'You know I'm a vegetarian!", "text_nl": "Je weet dat ik vegetariër ben!", "mp3": "./Mirabelle/page 09-02.mp3"}, {"text": "This is really disgraceful behavior Mirabelle.", "text_nl": "Dit is werkelijk schandalig gedrag, Mirabelle.", "mp3": "./Mirabelle/page 09-03.mp3"}, {"text": "I'm hoping for better from you this year at Witch School.'\n\nBy half past eight Wilbur and I were ready by the front door with our broomsticks.", "text_nl": "'Ik hoop dit jaar meer van je te zien op de Heksenschool.'\n\nOm half negen waren Wilbur en ik klaar bij de voordeur met onze bezemstelen.", "mp3": "./Mirabelle/page 09-04.mp3"}]}, {"jpegname": "page 10.jpeg", "text": "'Have a lovely first day back at school!' said Mum as she kissed us both goodbye.\n\n'And remember to behave yourselves,' said Dad.\n\n'I always behave myself!' said Wilbur indignantly.\n\n'I'm not talking to you,' said Dad and stared pointedly at me.\n\n18", "mp3": "./Mirabelle/page 10.mp3", "text_nl": "'Veel sterkte met je eerste schooldag!' zei Mum terwijl ze ons beiden kuste en afscheid nam.\n\n'En zorg ervoor dat jullie je gedragen,' zei Dad.\n\n'Ik gedraag me altijd netjes!' zei Wilbur verontwaardigd.\n\n'Ik heb het niet tegen jou,' zei Dad en staarde me veelzeggend aan.", "sentences": [{"text": "'Have a lovely first day back at school!' said Mum as she kissed us both goodbye.", "text_nl": "'Veel sterkte met je eerste schooldag!' zei Mum terwijl ze ons beiden kuste ter afscheid.", "mp3": "./Mirabelle/page 10-01.mp3"}, {"text": "'And remember to behave yourselves,' said Dad.", "text_nl": "'En vergeet niet jezelf goed te gedragen,' zei vader.", "mp3": "./Mirabelle/page 10-02.mp3"}, {"text": "'I always behave myself!' said Wilbur indignantly.", "text_nl": "'Ik gedraag me altijd goed!' zei Wilbur verontwaardigd.", "mp3": "./Mirabelle/page 10-03.mp3"}, {"text": "'I'm not talking to you,' said Dad and stared pointedly at me.", "text_nl": "'Ik praat niet met je,' zei Dad en staarde me doelbewust aan.", "mp3": "./Mirabelle/page 10-04.mp3"}, {"text": "18", "text_nl": "18", "mp3": "./Mirabelle/page 10-05.mp3"}]}, {"jpegname": "page 11.jpeg", "text": "Chapter\nTWO\n\nWilbur and I flew up into the air and flew side by side across the town that we live in. It was a misty morning and it felt wonderful to be out in the fresh air, whizzing along, high in the sky. When we came to the edge of the town we split up, heading in different directions.\n\n'Bye Wilbur!' I called as he", "text_nl": "Hoofdstuk\nTWEE\n\nWilbur en ik vlogen de lucht in en vlogen naast elkaar over de stad waar we wonen. Het was een mistige ochtend en het voelde heerlijk om in de frisse lucht te zijn, voortsnellend, hoog in de lucht. Toen we aan de rand van de stad kwamen, gingen we uit elkaar, elk in een ander richting.\n\n'Tot ziens Wilbur!' riep ik terwijl hij", "mp3": "./Mirabelle/page 11.mp3", "sentences": [{"text": "Chapter\nTWO\n\nWilbur and I flew up into the air and flew side by side across the town that we live in.", "text_nl": "Hoofdstuk\nTWEE\n\nWilbur en ik vlogen de lucht in en vlogen naast elkaar over de stad ol regulation hat down more firmly over my head because\n\n20", "text_nl": "Ik trok mijn schoolvoorschrift pet steviger over mijn hoofd omdat", "mp3": "./Mirabelle/page 12-04.mp3"}]}, {"jpegname": "page 13.jpeg", "text": "it was windy, and held on tightly to Violet as I flew on towards the deep dark forest and Miss Spindlewick's Witch School for Girls. I soon saw it looming up from between the trees—a tall, grey building with pointy roofs shaped like witch's hats. Right now they were wreathed in a ribbon of fog. I could see other young\n\n21", "text_nl": "Het was windig, en ik hield stevig vast aan Violet terwijl ik vloog naar het diepe donkere bos en Miss Spindlewicks Heksenschool voor Meisjes. Ik zag het al gauw tussen de bomen oprijzen—een hoog, grijs gebouw met puntige daken in de vorm van hekssenhoeden. Op dit moment waren ze omwikkeld met een lint van mist. Ik kon andere jonge", "mp3": "./Mirabelle/page 13.mp3", "sentences": [{"text": "it was windy, and held on tightly to Violet as I flew on towards the deep dark forest and Miss Spindlewick's Witch School for Girls.", "text_nl": "Het was winderig, en ik hield Violet stevig vast terwijl ik in de richting van het diepe donkere bos en Miss Spindlewicks Heksenschool voor Meisjes vloog.", "mp3": "./Mirabelle/page 13-01.mp3"}, {"text": "I soon saw it looming up from between the trees—a tall, grey building with pointy roofs shaped like witch's hats.", "text_nl": "Ik zag het al snel tussen de bomen uitrijzen—een hoog, grijs gebouw met puntige daken die op hekssenhoeden leken.", "mp3": "./Mirabelle/page 13-02.mp3"}, {"text": "Right now they were wreathed in a ribbon of fog.", "text_nl": "Op dit moment waren zij omwikkeld in een lint van mist.", "mp3": "./Mirabelle/page 13-03.mp3"}, {"text": "I could see other young\n\n21", "text_nl": "Ik kon andere jonge", "mp3": "./Mirabelle/page 13-04.mp3"}]}, {"jpegname": "page 14.jpeg", "text": "witches flying towards the school on their broomsticks, coming from all different directions and I felt a shiver run up and down my spine. I LOVE my witch school. It makes me feel scared and excited all at the same time! I pointed my broomstick towards the playground below and landed with a bump and a skid on the black tarmac. Then I heard my name 'Mirabelle!' and turned to see my best friend Carlotta running towards me with her black kitten Midnight scampering", "text_nl": "Heksen die op hun bezems naar de school vlogen, vanuit allerlei verschillende richtingen en ik voelde een rilling over mijn rug lopen. IK HOU VAN mijn heksenschool. Het geeft me tegelijkertijd het gevoel dat ik bang ben en opgewonden! Ik wees met mijn bezem naar de speelplaats eronder en landde met een bons en een slip op het zwarte asfalt. Toen hoorde ik mijn naam 'Mirabelle!' en draaide me om om mijn beste vriendin Carlotta naar me toe te zien rennen met haar zwarte kitten Midnight die achter haar aan huppelde.", "mp3": "./Mirabelle/page 14.mp3", "sentences": [{"text": "witches flying towards the school on their broomsticks, coming from all different directions and I felt a shiver run up and down my spine.", "text_nl": "Heksen die op hun bezems naar de school toe vlogen, uit alle verschillende richtingen komend, en ik voelde een rilling langs mijn ruggengraat gaan.", "mp3": "./Mirabelle/page 14-01.mp3"}, {"text": "I LOVE my witch school.", "text_nl": "Ik HOU van mijn heksenschool.", "mp3": "./Mirabelle/page 14-02.mp3"}, {"text": "It makes me feel scared and excited all at the same time!", "text_nl": "Het maakt me tegelijkertijd bang en opgewonden!", "mp3": "./Mirabelle/page 14-03.mp3"}, {"text": "I pointed my broomstick towards the playground below and landed with a bump and a skid on the black tarmac.", "text_nl": "Ik richtte mijn bezem naar de speelplaats beneden en landde met een bons en een slip op het zwarte asfalt.", "mp3": "./Mirabelle/page 14-04.mp3"}, {"text": "Then I heard my name 'Mirabelle!' and turned to see my best friend Carlotta running towards me with her black kitten Midnight scampering", "text_nl": "Toen hoorde ik mijn naam 'Mirabelle!' en draaide me om om mijn beste vriendin Carlotta naar me toe zien rennen met haar zwarte kitten Midnight erachteraan springend.", "mp3": "./Mirabelle/page 14-05.mp3"}]}, {"jpegname": "page 15.jpeg", "text": "along behind her.\n\n'I missed you over the holidays!' she said, enveloping me in a great squeezy hug.\n\n'I missed you too!' I said. 'It was so boring being apart! How was your holiday at the Witch Resort?'\n\n'Oh well... it was pretty magical actually,' Carlotta admitted. 'I wish you could have come too though. It was so far away we had to go on an aeroplane to get there.", "text_nl": "achter haar aan.\n\n'Ik heb je gemist in de vakantie!' zei ze, terwijl ze me in een grote stevige omhelzing nam.\n\n'Ik heb jou ook gemist!' zei ik. 'Het was zo saai om uit elkaar te zijn! Hoe was jouw vakantie in het Heksenkuuroord?'\n\n'Och nou... het was eigenlijk best magisch,' gaf Carlotta toe. 'Ik wou dat je ook kon zijn gekomen. Het was zo ver weg dat we met het vliegtuig moesten gaan.'", "mp3": "./Mirabelle/page 15.mp3", "sentences": [{"text": "along behind her.", "text_nl": "achter haar aan.", "mp3": "./Mirabelle/page 15-01.mp3"}, {"text": "'I missed you over the holidays!' she said, enveloping me in a great squeezy hug.", "text_nl": "\"Ik heb je gemist tijdens de feestdagen!\" zei ze, terwijl ze me in een grote, stevige omhelzing nam.", "mp3": "./Mirabelle/page 15-02.mp3"}, {"text": "'I missed you too!' I said.", "text_nl": "'Ik heb jou ook gemist!' zei ik.", "mp3": "./Mirabelle/page 15-03.mp3"}, {"text": "'It was so boring being apart!", "text_nl": "'Het was zo saai om apart te zijn!'", "mp3": "./Mirabelle/page 15-04.mp3"}, {"text": "How was your holiday at the Witch Resort?'\n\n'Oh well...", "text_nl": "'Hoe was je vakantie in het Hexenresort?'\n\n'Oh nou...'", "mp3": "./Mirabelle/page 15-05.mp3"}, {"text": "it was pretty magical actually,' Carlotta admitted.", "text_nl": "'Het was eigenlijk best magisch,' gaf Carlotta toe.", "mp3": "./Mirabelle/page 15-06.mp3"}, {"text": "'I wish you could have come too though.", "text_nl": "'Ik wou dat je ook had kunnen komen.'", "mp3": "./Mirabelle/page 15-07.mp3"}, {"text": "It was so far away we had to go on an aeroplane to get there.", "text_nl": "Het was zo ver weg dat we met een vliegtuig moesten gaan.", "mp3": "./Mirabelle/page 15-08.mp3"}]}, {"jpegname": "page 16.jpeg", "text": "The hotel was in the mountains. There was a bubbling cauldron hot tub and an all you can eat witch food buffet!'\n\nI wrinkled my nose at the idea of the buffet and clutched on tightly to my lunch box. Witch food is disgusting and I always bring my own lunch to school.\n\n'I bought you something from my holiday!' said Carlotta and rummaged in her schoolbag. She brought out a small potion bottle full of glittering iridescent powder.\n\n'I found it in the souvenir shop,' she said. 'I know you like collecting", "text_nl": "Het hotel lag in de bergen. Er was een borrelende ketel met warm water en een all-you-can-eat heksenbuffet!\n\nIk trok mijn neus op bij het idee van het buffet en greep mijn lunchbox stevig vast. Hekseneten is walgelijk en ik breng altijd mijn eigen lunch mee naar school.\n\n'Ik heb iets voor je meegenomen van mijn vakantie!' zei Carlotta en rommelde in haar schooltas. Ze haalde een klein flesje toverdrank tevoorschijn vol glitterend, iriserend poeder.\n\n'Ik heb het in de souvenirzaak gevonden,' zei ze. 'Ik weet dat je graag verzamelt'", "mp3": "./Mirabelle/page 16.mp3", "sentences": [{"text": "The hotel was in the mountains.", "text_nl": "Het hotel lag in de bergen.", "mp3": "./Mirabelle/page 16-01.mp3"}, {"text": "There was a bubbling cauldron hot tub and an all you can eat witch food buffet!'\n\nI wrinkled my nose at the idea of the buffet and clutched on tightly to my lunch box.", "text_nl": "Er was een borrelende ketel met warm water om in te baden en een all-you-can-eat heksespijs buffet!'\n\nIk trok mijn neus op bij het idee van het buffet en klemde mijn lunchbox stevig vast.", "mp3": "./Mirabelle/page 16-02.mp3"}, {"text": "Witch food is disgusting and I always bring my own lunch to school.", "text_nl": "Heksenbordvoedsel is walgelijk en ik breng altijd mijn eigen lunch mee naar school.", "mp3": "./Mirabelle/page 16-03.mp3"}, {"text": "'I bought you something from my holiday!' said Carlotta and rummaged in her schoolbag.", "text_nl": "'Ik heb iets voor je meegenomen van mijn vakantie!' zei Carlotta en rommelde in haar schooltas.", "mp3": "./Mirabelle/page 16-04.mp3"}, {"text": "She brought out a small potion bottle full of glittering iridescent powder.", "text_nl": "Ze haalde een klein drankflesje tevoorschijn vol schitterend iriserend poeder.", "mp3": "./Mirabelle/page 16-05.mp3"}, {"text": "'I found it in the souvenir shop,' she said.", "text_nl": "'Ik heb het in de souvenirwinkel gevonden,' zei ze.", "mp3": "./Mirabelle/page 16-06.mp3"}, {"text": "'I know you like collecting", "text_nl": "Ik weet dat je graag verzamelt", "mp3": "./Mirabelle/page 16-07.mp3"}]}, {"jpegname": "page 17.jpeg", "text": "pretty potion bottles.'\n\n'I do!' I said 'Thank you!' I turned the bottle over in my hands, marveling at the sparkling dust inside. It seemed to shimmer in every colour of the rainbow.\n\n'What does it do?' I asked.", "text_nl": "mooie drankflessen.'\n\n'Dat doe ik!' zei ik 'Dank je wel!' Ik draaide de fles in mijn handen om en bewonderde het schitterend stof erin. Het leek in alle kleuren van de regenboog te glinsteren.\n\n'Wat doet het?' vroeg ik.", "mp3": "./Mirabelle/page 17.mp3", "sentences": [{"text": "pretty potion bottles.'\n\n'I do!' I said 'Thank you!' I turned the bottle over in my hands, marveling at the sparkling dust inside.", "text_nl": "'mooie drankflessen.'\n\n'Dat doe ik!' zei ik. 'Dank je wel!' Ik draaide de fles om in mijn handen en keek vol bewondering naar het glinsterende stof erin.", "mp3": "./Mirabelle/page 17-01.mp3"}, {"text": "It seemed to shimmer in every colour of the rainbow.", "text_nl": "Het leek in elke kleur van de regenboog te schitteren.", "mp3": "./Mirabelle/page 17-02.mp3"}, {"text": "'What does it do?' I asked.", "text_nl": "'Wat doet het?' vroeg ik.", "mp3": "./Mirabelle/page 17-03.mp3"}]}, {"jpegname": "page 18.jpeg", "text": "'I'm not sure,' said Carlotta. 'The label is in a different language. But there's a picture of Rapunzel on the front, look! I thought maybe it was something to do with hair!'\n\n'Maybe it will make my hair grow really long!' I said excitedly.\n\n'Or make it change colour!' suggested Carlotta. 'But you should probably show it to your mum before you use it. I bet she'll know what it does. She's an expert in potion making isn't she?'\n\nI nodded. Mum and Dad have their own beauty business, concocting face creams, perfumes, and lipsticks. Mum can spend hours up in her 'witch turret'\n\n26", "text_nl": "'Ik weet het niet zeker,' zei Carlotta. 'Het etiket is in een ander taal. Maar er staat een plaatje van Rapunzel op de voorkant, kijk! Ik dacht misschien dat het iets met haar te maken had!'\n\n'Misschien zal het mijn haar echt heel lang laten groeien!' zei ik opgewonden.\n\n'Of het van kleur laten veranderen!' stelde Carlotta voor. 'Maar je zou het waarschijnlijk eerst aan je moeder moeten laten zien voordat je het gebruikt. Ik durf te wedden dat zij weet wat het doet. Zij is toch een expert in toverdranken maken?'\n\nIk knikte. Mam en Pap hebben hun eigen schoonheidsbedrijf, waar zij gezichtscrèmes, parfums en lippenstiften maken. Mam kan uren in haar 'hekscentrale' doorbrengen.\n\n26", "mp3": "./Mirabelle/page 18.mp3", "sentences": [{"text": "'I'm not sure,' said Carlotta.", "text_nl": "'Ik ben niet zeker,' zei Carlotta.", "mp3": "./Mirabelle/page 18-01.mp3"}, {"text": "'The label is in a different language.", "text_nl": "Het label is in een ander taal.", "mp3": "./Mirabelle/page 18-02.mp3"}, {"text": "But there's a picture of Rapunzel on the front, look!", "text_nl": "Maar er staat een plaatje van Rapunzel op de voorkant, kijk!", "mp3": "./Mirabelle/page 18-03.mp3"}, {"text": "I thought maybe it was something to do with hair!'\n\n'Maybe it will make my hair grow really long!' I said excitedly.", "text_nl": "'Ik dacht misschien dat het iets met haar te maken had!'\n\n'Misschien zal het mijn haar echt heel lang laten groeien!' zei ik enthousiast.", "mp3": "./Mirabelle/page 18-04.mp3"}, {"text": "'Or make it change colour!' suggested Carlotta.", "text_nl": "'Of maak het van kleur veranderen!' stelde Carlotta voor.", "mp3": "./Mirabelle/page 18-05.mp3"}, {"text": "'But you should probably show it to your mum before you use it.", "text_nl": "Maar je zou het waarschijnlijk eerst aan je moeder moeten laten zien voordat je het gebruikt.", "mp3": "./Mirabelle/page 18-06.mp3"}, {"text": "I bet she'll know what it does.", "text_nl": "Ik wed dat zij weet wat het doet.", "mp3": "./Mirabelle/page 18-07.mp3"}, {"text": "She's an expert in potion making isn't she?'\n\nI nodded.", "text_nl": "'Ze is toch een expert in drankjes brouwen, niet waar?'\n\nIk knikte.", "mp3": "./Mirabelle/page 18-08.mp3"}, {"text": "Mum and Dad have their own beauty business, concocting face creams, perfumes, and lipsticks.", "text_nl": "Mam en Pap hebben hun eigen schoonheidsbedrijf, waar ze gezichtscrèmes, parfums en lippenstiften maken.", "mp3": "./Mirabelle/page 18-09.mp3"}, {"text": "Mum can spend hours up in her 'witch turret'\n\n26", "text_nl": "Mam kan uren doorbrengen in haar 'heksentoren'", "mp3": "./Mirabelle/page 18-10.mp3"}]}, {"jpegname": "page 19.jpeg", "text": "experimenting with ingredients. Dad oversees to make sure everything is natural and then adds his special fairy touch at the end.\n\n'You better hide it!' hissed Carlotta suddenly and I looked up to see our teacher, Miss Spindlewick, coming towards us. Hurriedly, I slipped the potion bottle into the pocket of my skirt and tried to look innocent. We are not allowed to bring in magic ingredients from \n\n29", "text_nl": "Geen trucjes meer in", "mp3": "./Mirabelle/page 21-09.mp3"}]}, {"jpegname": "page 22.jpeg", "text": "the classroom.'\n\n'No tricks in the classroom!' said Carlotta.\n\n'We promise!' I said. And in that moment, with the shadow of Miss Spindlewick looming over us, I really did mean it.", "text_nl": "'Geen trucs in de klaslokaal!' zei Carlotta.\n\n'We beloven het!' zei ik. En op dat moment, met de schaduw van Miss Spindlewick boven ons uittorenend, meende ik het echt.", "mp3": "./Mirabelle/page 22.mp3", "sentences": [{"text": "the classroom.'\n\n'No tricks in the classroom!' said Carlotta.", "text_nl": "'Geen trucs in de klas!' zei Carlotta.", "mp3": "./Mirabelle/page 22-01.mp3"}, {"text": "'We promise!' I said.", "text_nl": "'Dat beloven we!' zei ik.", "mp3": "./Mirabelle/page 22-02.mp3"}, {"text": "And in that moment, with the shadow of Miss Spindlewick looming over us, I really did mean it.", "text_nl": "En in dat moment, met de schaduw van juffrouw Spindlewick boven ons uittorenend, meende ik het echt.", "mp3": "./Mirabelle/page 22-03.mp3"}]}, {"jpegname": "page 23.jpeg", "text": "Chapter\nTHREE\n\nOur first lesson was potions. My favourite! I watched in excitement as Miss Spindlewick handed out a shiny new cauldron to every pair of witches in the room. These cauldrons were bigger than the baby ones we had been allowed to use last year. I poked my head right into mine and Carlotta's, disappearing into the\n\n31", "text_nl": "Hoofdstuk\nDRIE\n\nOns eerste les was toverdrankjes. Mijn favoriete! Ik keek opgewonden toe terwijl juffrouw Spindlewick aan elk paar heksen in de kamer een gloednieuwe ketel uitdeelde. Deze ketels waren groter dan de babyketelaars die we vorig jaar mochten gebruiken. Ik stak mijn hoofd recht in de mijne en die van Carlotta, verdwijnend in de\n\n31", "mp3": "./Mirabelle/page 23.mp3", "sentences": [{"text": "Chapter\nTHREE\n\nOur first lesson was potions.", "text_nl": "Hoofdstuk\nDRIE\n\nOnze eerste les was toverdrankenkunde e bottles that I had to put some of them in my pockets in order to get them back to the desk. Meanwhile, Miss Spindlewick had turned off the lights and was busy", "text_nl": "'Dit ziet er niet al te moeilijk uit,' zei Carlotta. 'Ik ga de ingrediënten uit de kast halen,' zei ik, springend van mijn kruk en haastig naar de grote voorraadkast lopend waar alle potten en flessen werden bewaard. Ik moest even wachten omdat iedereen anders ook zijn ingrediënten probeerde te pakken, maar uiteindelijk kon ik me erdoorheen wurmen en alle dingen pakken die we nodig hadden. Er waren zoveel kleine flesjes dat ik sommige ervan in mijn zakken moest doen om ze terug naar het bureau te brengen. Ondertussen had juffrouw Spindlewick het licht uitgedaan en was bezig", "mp3": "./Mirabelle/page 27.mp3", "sentences": [{"text": "'This doesn't look too hard,' said Carlotta.", "text_nl": "'Dit ziet er niet al te moeilijk uit,' zei Carlotta.", "mp3": "./Mirabelle/page 27-01.mp3"}, {"text": "'I'll go and get the ingredients from the cupboard,' I said, jumping off my stool and hurrying over to the big store cupboard where all the jars and bottles were kept.", "text_nl": "'Ik ga de ingrediënten uit de kast halen,' zei ik, springend van mijn kruk af en haastig naar de grote voorraadkast lopend waar alle potten en flessen werden bewaard.", "mp3": "./Mirabelle/page 27-02.mp3"}, {"text": "I had to wait a little bit as everyone else was also trying to get their ingredients too but at last I was able to squirm in and get all the things we needed.", "text_nl": "Ik moest een beetje wachten omdat iedereen anders ook hun ingrediënten probeerde te krijgen, maar uiteindelijk kon ik me erdoorheen wurmen en alles krijgen wat we nodig hadden.", "mp3": "./Mirabelle/page 27-03.mp3"}, {"text": "There were so many little bottles that I had to put some of them in my pockets in order to get them back to the desk.", "text_nl": "Er waren zoveel kleine flessen dat ik er enkele in mijn zakken moest stoppen om ze terug naar het bureau te brengen.", "mp3": "./Mirabelle/page 27-04.mp3"}, {"text": "Meanwhile, Miss Spindlewick had turned off the lights and was busy", "text_nl": "Ondertussen had juffrouw Spindlewick de lichten uitgedaan en was druk bezig", "mp3": "./Mirabelle/page 27-05.mp3"}]}, {"jpegname": "page 28.jpeg", "text": "lighting candles all around the room.\n'For atmosphere,' she explained.\n'Witch magic always works best with\na bit of atmosphere.'", "text_nl": "Kaarsjes overal in de kamer aansteken.\n'Voor de sfeer,' legde ze uit.\n'Heksenmаgie werkt altijd het beste met\neen beetje sfeer.'", "mp3": "./Mirabelle/page 28.mp3", "sentences": [{"text": "lighting candles all around the room.", "text_nl": "kaarsjes aansteken overal in de kamer.", "mp3": "./Mirabelle/page 28-01.mp3"}, {"text": "'For atmosphere,' she explained.", "text_nl": "'Voor de sfeer,' legde zij uit.", "mp3": "./Mirabelle/page 28-02.mp3"}, {"text": "'Witch magic always works best with\na bit of atmosphere.'", "text_nl": "'Heksenmagi werkt altijd het best met wat sfeer.'", "mp3": "./Mirabelle/page 28-03.mp3"}]}, {"jpegname": "page 29.jpeg", "text": "'I think witch magic works best when you can see what you're doing,' whispered Carlotta as she now strained to read the shadowy page of the spell book.\n\nWe started to make our potion, throwing in a bit of this and a sprinkle of that, being careful to weigh the ingredients on an old fashioned set of scales.", "text_nl": "'Ik denk dat heksenmagi het beste werkt wanneer je kunt zien wat je doet,' fluisterde Carlotta terwijl ze nu moeite had om de schaduwrijke pagina van het spreukboek te lezen.\n\nWe begonnen onze drank te maken, gooiden hier wat in en strooiden daar wat over, en waren voorzichtig om de ingrediënten af te wegen op een ouderwetse weegschaal.", "mp3": "./Mirabelle/page 29.mp3", "sentences": [{"text": "'I think witch magic works best when you can see what you're doing,' whispered Carlotta as she now strained to read the shadowy page of the spell book.", "text_nl": "'Ik denk dat heksemagie het beste werkt wanneer je kunt zien wat je doet,' fluisterde Carlotta terwijl ze zich nu inspande om de schaduwrijke bladzijde van het spreukenboek te lezen.", "mp3": "./Mirabelle/page 29-01.mp3"}, {"text": "We started to make our potion, throwing in a bit of this and a sprinkle of that, being careful to weigh the ingredients on an old fashioned set of scales.", "text_nl": "We begonnen onze toverdrankje te maken, gooiden hier en daar wat in, en zorgden ervoor de ingrediënten voorzichtig op een oude weegschaal af te wegen.", "mp3": "./Mirabelle/page 29-02.mp3"}]}, {"jpegname": "page 30.jpeg", "text": "'It's looking right so far,' said Carlotta as we both peered into the cauldron. 'Nice and bubbly!'\n\n'We need a whole bottle of unicorn horn dust to finish it off,' I said reading the last ingredient in the spell book.\n\nI picked up a small, pretty bottle of shimmering rainbow-y dust and tossed the whole lot into the cauldron.\n\n'Perfect!' said Carlotta and we both grinned at each other in the candlelight. Our potion began to fizz and froth in front of us, throwing up little sparks into the air.", "text_nl": "'Het ziet er tot nu toe goed uit,' zei Carlotta terwijl we beiden in de ketel keken. 'Mooi en bruisend!'\n\n'We hebben een hele fles eenhoornthoornstof nodig om het af te maken,' zei ik terwijl ik het laatste ingrediënt in het spreukboek las.\n\nIk pakte een klein, mooi flesje met glitterend regenboogstof en gooide alles in de ketel.\n\n'Volmaakt!' zei Carlotta en we grijnsden elkaar toe in het kaarslicht. Onze drank begon voor onze neus te sissen en te schuimen en gooide kleine vonkjes de lucht in.", "mp3": "./Mirabelle/page 30.mp3", "sentences": [{"text": "'It's looking right so far,' said Carlotta as we both peered into the cauldron.", "text_nl": "'Het ziet er tot nu toe goed uit,' zei Carlotta terwijl we beiden in de ketel tuurden.", "mp3": "./Mirabelle/page 30-01.mp3"}, {"text": "'Nice and bubbly!'\n\n'We need a whole bottle of unicorn horn dust to finish it off,' I said reading the last ingredient in the spell book.", "text_nl": "'Lekker en bruisend!'\n\n'We need a whole bottle of unicorn horn dust to finish it off,' zei ik terwijl ik het laatste ingrediënt in het spreukenboek las.\n\n---\n\nExcuses, hier is de volledig Nederlandse versie:\n\n'Lekker en bruisend!'\n\n'We hebben een hele fles eenhoornhoorns stof nodig om het af te maken,' zei ik terwijl ik het laatste ingrediënt in het spreukenboek las.", "mp3": "./Mirabelle/page 30-02.mp3"}, {"text": "I picked up a small, pretty bottle of shimmering rainbow-y dust and tossed the whole lot into the cauldron.", "text_nl": "Ik pakte een klein, mooi flesje met glitterend regenboogstof op en gooide alles in de ketel.", "mp3": "./Mirabelle/page 30-03.mp3"}, {"text": "'Perfect!' said Carlotta and we both grinned at each other in the candlelight.", "text_nl": "'Perfect!' zei Carlotta en we grijnzden elkaar aan in het kaarslicht.", "mp3": "./Mirabelle/page 30-04.mp3"}, {"text": "Our potion began to fizz and froth in front of us, throwing up little sparks into the air.", "text_nl": "Onze toverdrank begon voor onze ogen te sissen en te schuimen, waarbij kleine vonkjes in de lucht werden geworpen.", "mp3": "./Mirabelle/page 30-05.mp3"}]}, {"jpegname": "page 31.jpeg", "text": "'Is it supposed to fizz?' I asked after a moment. 'It doesn't say anything about fizzing in the spell book.'\n\n'I'm sure it's fine,' said Carlotta. 'Let's take a little bit out and put it in a vial so we can test it on the rose! That's what it says to do here.'\n\nI squinted down at the instructions. 'Take a glass vial and pour a little of the green mixture into it,' I read out loud. Then I frowned.\n\n'Carlotta,' I said. 'Our mixture isn't green. It's purple!'\n\n'What do you mean?' said Carlotta, peering into the cauldron. 'It probably just looks like that in the candlelight.'", "text_nl": "'Hoort dat te bruisen?' vroeg ik even later. 'Er staat niets over bruisen in het spreukenboek.'\n\n'Ik ben zeker dat het prima is,' zei Carlotta. 'Laten we er een beetje uithalen en in een flesje doen zodat we het op de roos kunnen testen! Dat staat hier te doen.'\n\nIk tuurde naar de instructies. 'Pak een glazen flesje en giet er een beetje van het groene mengsel in,' las ik hardop voor. Toen fronste ik mijn wenkbrauwen.\n\n'Carlotta,' zei ik. 'Ons mengsel is niet groen. Het is paars!'\n\n'Wat bedoel je?' zei Carlotta, terwijl ze in de ketel keek. 'Het ziet er waarschijnlijk alleen zo uit in het kaarslicht.'", "mp3": "./Mirabelle/page 31.mp3", "sentences": [{"text": "'Is it supposed to fizz?' I asked after a moment.", "text_nl": "'Hoort het te bruisen?' vroeg ik even later.", "mp3": "./Mirabelle/page 31-01.mp3"}, {"text": "'It doesn't say anything about fizzing in the spell book.'\n\n'I'm sure it's fine,' said Carlotta.", "text_nl": "'Het zegt niets over bruisen in het spreukenboek.'\n\n'Ik weet zeker dat het prima is,' zei Carlotta.", "mp3": "./Mirabelle/page 31-02.mp3"}, {"text": "'Let's take a little bit out and put it in a vial so we can test it on the rose!", "text_nl": "'Laten we er een beetje uit nemen en in een flesje doen zodat we het op de roos kunnen testen!'", "mp3": "./Mirabelle/page 31-03.mp3"}, {"text": "That's what it says to do here.'\n\nI squinted down at the instructions.", "text_nl": "'Dat staat hier te doen.'\n\nIk tuurde naar de instructies.", "mp3": "./Mirabelle/page 31-04.mp3"}, {"text": "'Take a glass vial and pour a little of the green mixture into it,' I read out loud.", "text_nl": "'Pak een glazen flesje en giet er een beetje van het groene mengsel in,' las ik hardop voor.", "mp3": "./Mirabelle/page 31-05.mp3"}, {"text": "Then I frowned.", "text_nl": "Toen fronste ik mijn wenkbrauwen.", "mp3": "./Mirabelle/page 31-06.mp3"}, {"text": "'Carlotta,' I said.", "text_nl": "'Carlotta,' zei ik.", "mp3": "./Mirabelle/page 31-07.mp3"}, {"text": "'Our mixture isn't green.", "text_nl": "Ons mengsel is niet groen.", "mp3": "./Mirabelle/page 31-08.mp3"}, {"text": "It's purple!'\n\n'What do you mean?' said Carlotta, peering into the cauldron.", "text_nl": "'Het is paars!'\n\n'Wat bedoel je?' zei Carlotta, terwijl ze in de ketel gluurde.", "mp3": "./Mirabelle/page 31-09.mp3"}, {"text": "'It probably just looks like that in the candlelight.'", "text_nl": "'Het ziet er waarschijnlijk alleen maar zo uit in het kaarslicht.'", "mp3": "./Mirabelle/page 31-10.mp3"}]}, {"jpegname": "page 32.jpeg", "text": "'No,' I said. 'It's definitely purple!'\n\nWe both stepped back as our potion began to fizz and froth more violently, bubbling over and splattering onto the desk. Carlotta stared at me with wide eyes.\n\n'Mirabelle,' she whispered. 'I think you made a mistake.'", "text_nl": "'Nee,' zei ik. 'Het is echt paars!'\n\nWe stapten beiden achteruit toen ons drankje heviger begon te sissen en te schuimen, en het borrelende vocht spetterde op het bureau. Carlotta staarde me aan met grote ogen.\n\n'Mirabelle,' fluisterde ze. 'Ik denk dat je een fout hebt gemaakt.'", "mp3": "./Mirabelle/page 32.mp3", "sentences": [{"text": "'No,' I said.", "text_nl": "'Nee,' zei ik.", "mp3": "./Mirabelle/page 32-01.mp3"}, {"text": "'It's definitely purple!'\n\nWe both stepped back as our potion began to fizz and froth more violently, bubbling over and splattering onto the desk.", "text_nl": "'Het is zeker paars!'\n\nWe stapten beiden achteruit toen ons drankje heftiger begon te sissen en te schuimen, bruisend over de rand gutste en op het bureau spatte.", "mp3": "./Mirabelle/page 32-02.mp3"}, {"text": "Carlotta stared at me with wide eyes.", "text_nl": "Carlotta staarde me met grote ogen aan.", "mp3": "./Mirabelle/page 32-03.mp3"}, {"text": "'Mirabelle,' she whispered.", "text_nl": "'Mirabelle,' fluisterde ze.", "mp3": "./Mirabelle/page 32-04.mp3"}, {"text": "'I think you made a mistake.'", "text_nl": "Ik denk dat je een fout hebt gemaakt.", "mp3": "./Mirabelle/page 32-05.mp3"}]}, {"jpegname": "page 33.jpeg", "text": "'Me!?' I said indignantly. 'How could I have?' We followed all the instructions.' Carlotta pointed at the empty bottle of unicorn horn dust sitting on the desk. 'You poured the wrong bottle in,' she said. 'That's the bottle I brought you back from holiday!'\n\n'It can't be!' I said, thrusting my hand into my pocket and bringing out a very similar bottle with a label on it saying 'unicorn horn.' I stared at it in horror and my heart started to beat very fast.\n\n'They must have got mixed up in your pocket when you were carrying all", "text_nl": "'Ik!?' zei ik verontwaardigd. 'Hoe had ik dat kunnen doen?' We hebben alle instructies gevolgd.' Carlotta wees naar de lege fles eenhoornhoornstof die op het bureau stond. 'Je hebt de verkeerde fles erin gegoten,' zei ze. 'Dat is de fles die ik voor je uit vakantie heb meegenomen!'\n\n'Dat kan niet!' zei ik, terwijl ik mijn hand in mijn zak stak en een erg gelijkaardige fles tevoorschijn haalde met een etiket waarop 'eenhoornhoorn' stond. Ik staarde ernaar in afgrijzen en mijn hart begon heel snel te kloppen.\n\n'Ze moeten in je zak door elkaar zijn geraakt toen je alles aan het dragen was'", "mp3": "./Mirabelle/page 33.mp3", "sentences": [{"text": "'Me!?' I said indignantly.", "text_nl": "'Ik!?' zei ik verontwaardigd.", "mp3": "./Mirabelle/page 33-01.mp3"}, {"text": "'How could I have?' We followed all the instructions.' Carlotta pointed at the empty bottle of unicorn horn dust sitting on the desk.", "text_nl": "'Hoe had ik dat kunnen doen?' We hebben alle instructies gevolgd.' Carlotta wees naar de lege fles met eenhoornestaof die op het bureau stond.", "mp3": "./Mirabelle/page 33-02.mp3"}, {"text": "'You poured the wrong bottle in,' she said.", "text_nl": "'Je hebt de verkeerde fles ingegoten,' zei ze.", "mp3": "./Mirabelle/page 33-03.mp3"}, {"text": "'That's the bottle I brought you back from holiday!'\n\n'It can't be!' I said, thrusting my hand into my pocket and bringing out a very similar bottle with a label on it saying 'unicorn horn.' I stared at it in horror and my heart started to beat very fast.", "text_nl": "'Dat is de fles die ik voor je uit vakantie heb meegenomen!'\n\n'Dat kan niet!' zei ik, mijn hand in mijn zak stekend en een erg gelijkaardige fles tevoorschijn halend met een etiket waarop 'eenhoornshoorn' stond. Ik staarde ernaar in afschuw en mijn hart begon zeer snel te kloppen.", "mp3": "./Mirabelle/page 33-04.mp3"}, {"text": "'They must have got mixed up in your pocket when you were carrying all", "text_nl": "'Ze moeten zich in je zak hebben vermengd toen je alles droeg'", "mp3": "./Mirabelle/page 33-05.mp3"}]}, {"jpegname": "page 34.jpeg", "text": "the bottles back to the desk!' said Carlotta. 'Oh Mirabelle! What are we going to do?'\n\n'I don't know!' I whispered, feeling panicked.\n\nWe took another step back from the cauldron as the potion began to fizz and froth even more, spitting globules of purple gloop across the room.\n\n'Oh no! Oh no!' I cried. 'This is bad Carlotta!' The potion was going everywhere. It was spitting so far", "text_nl": "'de flessen terug naar het bureau!' zei Carlotta. 'Oh Mirabelle! Wat gaan we doen?'\n\n'Ik weet het niet!' fluisterde ik, voelend dat ik in paniek raakte.\n\nWe deden nog een stap achteruit weg van de ketel terwijl het drankje begon te sissen en te schuimen, nog meer paarse klodders spetterend door de kamer.\n\n'Oh nee! Oh nee!' riep ik. 'Dit is erg Carlotta!' Het drankje spoot overal heen. Het spatte zo ver", "mp3": "./Mirabelle/page 34.mp3", "sentences": [{"text": "the bottles back to the desk!' said Carlotta.", "text_nl": "'de flessen terug naar het bureau!' zei Carlotta.", "mp3": "./Mirabelle/page 34-01.mp3"}, {"text": "'Oh Mirabelle!", "text_nl": "Oh Mirabelle!", "mp3": "./Mirabelle/page 34-02.mp3"}, {"text": "What are we going to do?'\n\n'I don't know!' I whispered, feeling panicked.", "text_nl": "'Wat gaan we doen?'\n\n'Ik weet het niet!' fluisterde ik, voelend dat ik in paniek raakte.", "mp3": "./Mirabelle/page 34-03.mp3"}, {"text": "We took another step back from the cauldron as the potion began to fizz and froth even more, spitting globules of purple gloop across the room.", "text_nl": "We deden nog een stap naar achteren bij de ketel terwijl het drankje nog meer begon te sissen en te schuimen, waarbij paarse klodders over de kamer heen werden gespoten.", "mp3": "./Mirabelle/page 34-04.mp3"}, {"text": "'Oh no!", "text_nl": "Oh nee!", "mp3": "./Mirabelle/page 34-05.mp3"}, {"text": "Oh no!' I cried.", "text_nl": "'Oh nee!' riep ik uit.", "mp3": "./Mirabelle/page 34-06.mp3"}, {"text": "'This is bad Carlotta!' The potion was going everywhere.", "text_nl": "'Dit is erg slecht Carlotta!' De drank verspreidde zich overal.", "mp3": "./Mirabelle/page 34-07.mp3"}, {"text": "It was spitting so far", "text_nl": "Het spuugde tot zo ver.", "mp3": "./Mirabelle/page 34-08.mp3"}]}, {"jpegname": "page 35.jpeg", "text": "that it was landing on the heads of all the other witches in the room. Including Miss Spindlewick. A few drops splashed onto her head and she looked up from her desk.\n\n'WHAT is going on?' she said, reaching up to wipe the potion off her hair. Then she spotted our cauldron, shaking and groaning and spluttering and her eyebrows shot up so high that they almost disappeared into her hair. She leapt up off her chair and pointed towards the door.", "text_nl": "dat het op de hoofden van alle andere heksen in de kamer terechtkwam. Ook op die van juffrouw Spindlewick. Een paar druppels spetterden op haar hoofd en ze keek op van haar bureau.\n\n'WAT gebeurt hier?' zei ze, terwijl ze omhooggreifte om het drankje uit haar haar te vegen. Toen zag ze onze ketel, die schudde en kreunde en sputerde, en haar wenkbrauwen schoten zo hoog omhoog dat ze bijna in haar haar verdwenen. Ze sprong overeind uit haar stoel en wees naar de deur.", "mp3": "./Mirabelle/page 35.mp3", "sentences": [{"text": "that it was landing on the heads of all the other witches in the room.", "text_nl": "dat het op de hoofden van alle andere heksen in de kamer landde.", "mp3": "./Mirabelle/page 35-01.mp3"}, {"text": "Including Miss Spindlewick.", "text_nl": "Met inbegrip van juffrouw Spindlewick.", "mp3": "./Mirabelle/page 35-02.mp3"}, {"text": "A few drops splashed onto her head and she looked up from her desk.", "text_nl": "Een paar druppels spatten op haar hoofd en ze keek op van haar bureau.", "mp3": "./Mirabelle/page 35-03.mp3"}, {"text": "'WHAT is going on?' she said, reaching up to wipe the potion off her hair.", "text_nl": "'Wat gebeurt hier?' zei ze, terwijl ze omhoog reikte om het drankje uit haar haar te vegen.", "mp3": "./Mirabelle/page 35-04.mp3"}, {"text": "Then she spotted our cauldron, shaking and groaning and spluttering and her eyebrows shot up so high that they almost disappeared into her hair.", "text_nl": "Toen zag ze onze ketel, die schudde en kreunde en sputterde, en haar wenkbrauwen schoten zo hoog omhoog dat ze bijna in haar haar verdwenen.", "mp3": "./Mirabelle/page 35-05.mp3"}, {"text": "She leapt up off her chair and pointed towards the door.", "text_nl": "Ze sprong overeind uit haar stoel en wees naar de deur.", "mp3": "./Mirabelle/page 35-06.mp3"}]}, {"jpegname": "page 36.jpeg", "text": "'EVACUATE THE ROOM!'\nSuddenly everything\nwas in chaos. Witches and\nfamiliars surged towards the\ndoor, knocking over stools and\ncauldrons as they tried to escape\nour bubbling, hissing potion,\nwhich was now frothing and\nfizzing so much that it was\nmaking the cauldron vibrate.", "text_nl": "'VERLAAT ONMIDDELLIJK DE RUIMTE!'\nPlotseling was alles\nin chaos. Heksen en\nhun familiars stormden naar de\ndeur, waarbij ze krukken en\nketels omvergooidenin hun poging\nom weg te komen van onze\nborrelende, sissende drank,\ndie nu zo veel schuim en\nkoolzuurhoudend was dat de\nketel ervan trilde.", "mp3": "./Mirabelle/page 36.mp3", "sentences": [{"text": "'EVACUATE THE ROOM!'\nSuddenly everything\nwas in chaos.", "text_nl": "'EVACUEER DE RUIMTE!'\nPlotseling was alles\nin         let mode = 'page'; // 'page' of 'sentence'
        let showTranslation = false;
        let currentPageIndex = 0;
        let currentSentenceIndex = 0;
        let sortedItems = [];
        let allSentences = [];

        const audio = document.getElementById('audio-player');
        const prevBtn = document.getElementById('prev-btn');
        const nextBtn = document.getElementById('next-btn');
        const playBtn = document.getElementById('play-btn');
        const pageIndicator = document.getElementById('page-indicator');
        const pageTitle = document.getElementById('page-title');
        const textContent = document.getElementById('text-content');
        const modePageBtn = document.getElementById('mode-page');
        const modeSentenceBtn = document.getElementById('mode-sentence');
        const transOffBtn = document.getElementById('trans-off');
        const transOnBtn = document.getElementById('trans-on');
        const translationContainer = document.getElementById('translation-container');
        const translationText = document.getElementById('translation-text');

        function getPageNumber(filename) {
            const match = filename.match(/(\d+)/);
            return match ? parseInt(match[1]) : 0;
        }

        function sortItems(items) {
            return [...items].sort((a, b) => getPageNumber(a.jpegname) - getPageNumber(b.jpegname));
        }

        function buildAllSentences() {
            allSentences = [];
            sortedItems.forEach((item, pageIdx) => {
                (item.sentences || []).forEach((sentence, sentIdx) => {
                    allSentences.push({
                        pageIndex: pageIdx,
                        sentenceIndex: sentIdx,
                        text: sentence.text,
                        text_nl: sentence.text_nl,
                        mp3: sentence.mp3,
                        pageName: item.jpegname
                    });
                });
            });
        }

        function init() {
            sortedItems = sortItems(DATA.items);
            buildAllSentences();
            updateUI();
        }

        function setMode(newMode) {
            mode = newMode;
            modePageBtn.classList.toggle('active', mode === 'page');
            modeSentenceBtn.classList.toggle('active', mode === 'sentence');

            if (mode === 'sentence' && allSentences.length > 0) {
                const firstSentence = allSentences.findIndex(s => s.pageIndex === currentPageIndex);
                currentSentenceIndex = firstSentence >= 0 ? firstSentence : 0;
            }
            stopAudio();
            updateUI();
        }

        function setTranslation(show) {
            showTranslation = show;
            transOffBtn.classList.toggle('active', !show);
            transOnBtn.classList.toggle('active', show);
            updateUI();
        }

        function updateUI() {
            if (mode === 'page') {
                updateUIPage();
            } else {
                updateUISentence();
            }
        }

        function updateUIPage() {
            if (sortedItems.length === 0) {
                pageIndicator.textContent = '-';
                pageTitle.textContent = '';
                textContent.textContent = 'Geen paginas gevonden';
                translationContainer.classList.add('hidden');
                return;
            }
            const item = sortedItems[currentPageIndex];
            prevBtn.disabled = currentPageIndex === 0;
            nextBtn.disabled = currentPageIndex === sortedItems.length - 1;
            playBtn.disabled = !item.mp3;
            pageIndicator.textContent = 'Pagina ' + (currentPageIndex + 1) + ' / ' + sortedItems.length;
            pageTitle.textContent = item.jpegname;
            textContent.textContent = item.text || 'Geen tekst beschikbaar';
            if (item.mp3) { audio.src = item.mp3; }

            // Vertaling
            if (showTranslation && item.text_nl) {
                translationText.textContent = item.text_nl;
                translationContainer.classList.remove('hidden');
            } else {
                translationContainer.classList.add('hidden');
            }
        }

        function updateUISentence() {
            if (allSentences.length === 0) {
                pageIndicator.textContent = '-';
                pageTitle.textContent = '';
                textContent.textContent = 'Geen zinnen gevonden';
                translationContainer.classList.add('hidden');
                return;
            }
            const sentence = allSentences[currentSentenceIndex];
            prevBtn.disabled = currentSentenceIndex === 0;
            nextBtn.disabled = currentSentenceIndex === allSentences.length - 1;
            playBtn.disabled = !sentence.mp3;
            pageIndicator.textContent = 'Zin ' + (currentSentenceIndex + 1) + ' / ' + allSentences.length;
            pageTitle.textContent = sentence.pageName + ' - zin ' + (sentence.sentenceIndex + 1);
            textContent.innerHTML = '<span class="sentence-highlight">' + sentence.text + '</span>';
            if (sentence.mp3) { audio.src = sentence.mp3; }

            // Vertaling
            if (showTranslation && sentence.text_nl) {
                translationText.textContent = sentence.text_nl;
                translationContainer.classList.remove('hidden');
            } else {
                translationContainer.classList.add('hidden');
            }
        }

        function goPrev() {
            if (mode === 'page') {
                if (currentPageIndex > 0) { currentPageIndex--; stopAudio(); updateUI(); }
            } else {
                if (currentSentenceIndex > 0) { currentSentenceIndex--; stopAudio(); updateUI(); }
            }
        }

        function goNext() {
            if (mode === 'page') {
                if (currentPageIndex < sortedItems.length - 1) { currentPageIndex++; stopAudio(); updateUI(); }
            } else {
                if (currentSentenceIndex < allSentences.length - 1) { currentSentenceIndex++; stopAudio(); updateUI(); }
            }
        }

        function togglePlay() { if (audio.paused) { audio.play(); } else { audio.pause(); } }
        function stopAudio() { audio.pause(); audio.currentTime = 0; updatePlayButton(false); }
        function updatePlayButton(isPlaying) {
            if (isPlaying) { playBtn.innerHTML = '&#10074;&#10074; Pauze'; playBtn.classList.add('playing'); }
            else { playBtn.innerHTML = '&#9658; Play'; playBtn.classList.remove('playing'); }
        }

        modePageBtn.addEventListener('click', () => setMode('page'));
        modeSentenceBtn.addEventListener('click', () => setMode('sentence'));
        transOffBtn.addEventListener('click', () => setTranslation(false));
        transOnBtn.addEventListener('click', () => setTranslation(true));
        prevBtn.addEventListener('click', goPrev);
        nextBtn.addEventListener('click', goNext);
        playBtn.addEventListener('click', togglePlay);
        audio.addEventListener('play', () => updatePlayButton(true));
        audio.addEventListener('pause', () => updatePlayButton(false));
        audio.addEventListener('ended', () => updatePlayButton(false));
        document.addEventListener('keydown', (e) => {
            if (e.key === 'ArrowLeft') goPrev();
            else if (e.key === 'ArrowRight') goNext();
            else if (e.key === ' ') { e.preventDefault(); if (!playBtn.disabled) togglePlay(); }
            else if (e.key === 't' || e.key === 'T') setTranslation(!showTranslation);
        });

        init();
    </script>
