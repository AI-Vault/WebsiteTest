
<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>AI news internet</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      padding: 20px;
      background-color: #f9f9f9;
      color: #333;
    }

    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
      flex-wrap: wrap;
    }

    .toggle-label {
      font-size: 0.95em;
      background: #fff;
      padding: 8px 12px;
      border-radius: 20px;
      box-shadow: 0 2px 6px rgba(0,0,0,0.1);
      cursor: pointer;
    }

    .container {
      display: flex;
      flex-wrap: wrap;
      gap: 15px;
    }

    .vakje-link {
      text-decoration: none;
      color: inherit;
    }

    .vakje {
      width: 120px;
      height: 80px;
      border: 2px solid #000;
      border-radius: 8px;
      background-color: #ffffff;
      transition: all 0.3s ease;
      padding: 10px;
      box-sizing: border-box;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
    }

    .vakje.large {
      width: 250px;
      height: 160px;
    }

    .vakje:hover {
      background-color: #f0f0f0;
    }

    .vakje .tekst {
      font-weight: bold;
      margin-bottom: 6px;
    }

    .vakje .description {
      display: none;
      font-size: 0.9em;
      color: #555;
    }

    .vakje.large .description {
      display: block;
    }
  </style>
</head>
<body>

<div class="header">
  <h1>AI news internet</h1>
  <label class="toggle-label">
    <input type="checkbox" id="toggleView"> Grote weergave
  </label>
</div>

<div class="container" id="vakjes-container"></div>

<script>
  const links = [
  { tekst: "BeNeRL", url: "https://www.benerl.org/", beschrijving: "BeNe Reinforcement Learning Conference", kleur: "#76AE93" },
  { tekst: "Surf Adv Computing Day Jaarbeurs", url: "https://www.benerl.org/", beschrijving: "SURF event jaarlijks in jaarbeurs", kleur: "#add8e6" },
  { tekst: "CWI events", url: "https://www.cwi.nl/en/events/all-events/", beschrijving: "CWI events", kleur: "#E8F1F2" },
  { tekst: "Linkedin Delft AI", url: "https://www.linkedin.com/showcase/tudelftai/", beschrijving: "Note: Niet hetzelfde als emailtje", kleur: "#7a9e7e" },
  { tekst: "Kivi Agenda", url: "https://kivi.nl/activiteiten", beschrijving: "Kivi agenda", kleur: "#add8e6" },
  { tekst: "Ducums Jaarbeurs", url: "https://www.computationalsciencenl.nl/ducoms/", beschrijving: "Ducoms vorige keer in Jaarbeurs", kleur: "#B3EFB2" },
  { tekst: "BNAIC BeNeRL", url: "https://docs.unamur.be/en/bnaic2025", beschrijving: "BNAIC conferentie", kleur: "#8C2E36" },
  { tekst: "Tekst 8", url: "https://voorbeeld8.nl", beschrijving: "Informatie over product acht is hier te vinden.", kleur: "#C36A5B" },
  { tekst: "Trouw Ilyaz Nasrullah", url: "https://www.trouw.nl/columns/Ilyaz-Nasrullah", beschrijving: "Trouw AI scepticus.", kleur: "#76AE93" },
  { tekst: "Ethan Mollick Twitter", url: "https://x.com/emollick", beschrijving: "Ethan Mollick tweets.", kleur: "#add8e6"},
  { tekst: "Tekst 10", url: "https://voorbeeld10.nl", beschrijving: "Een overzicht van veelgestelde vragen staat hier.", kleur: "#D5BB91" },
  { tekst: "AI wereld krant generator", url: "https://chatgpt.com/g/g-68507d3f1b548191ab14ba322e28e8b6-ai-nieuws-wereldwijd", beschrijving: "Wereldwijde AI artikelen uit wereld kranten", kleur: "#7a9e7e" },
  { tekst: "Artikel jail breaking", url: "https://www.arxiv.org/pdf/2505.10066", beschrijving: "Beschrijft hoe makkelijk LLM jailbreaking", kleur: "#D5BB91" },
  { tekst: "Tekst 10", url: "https://voorbeeld10.nl", beschrijving: "Een overzicht van veelgestelde vragen staat hier.", kleur: "#D5BB91" },
  { tekst: "Tekst 10", url: "https://voorbeeld10.nl", beschrijving: "Een overzicht van veelgestelde vragen staat hier.", kleur: "#EBBA7C" }
];

  const container = document.getElementById("vakjes-container");
  const toggle = document.getElementById("toggleView");

  function renderBoxes(large = false) {
    container.innerHTML = "";

    links.forEach(link => {
      const a = document.createElement("a");
      a.href = link.url;
      a.target = "_blank";
      a.className = "vakje-link";

      const vakje = document.createElement("div");
      vakje.className = "vakje" + (large ? " large" : "");
      vakje.style.backgroundColor = link.kleur || "#ffffff";

      const tekst = document.createElement("div");
      tekst.className = "tekst";
      tekst.textContent = link.tekst;

      const desc = document.createElement("div");
      desc.className = "description";
      desc.textContent = link.beschrijving;

      vakje.appendChild(tekst);
      vakje.appendChild(desc);
      a.appendChild(vakje);
      container.appendChild(a);
    });
  }

  toggle.addEventListener("change", function() {
    renderBoxes(this.checked);
  });

  renderBoxes(false);
</script>

</body>
</html>
