
<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8">
  <title>Markdown Nieuwsweergave</title>
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <style>
    body {
      background-color: #FAF9F6;
      font-family: Georgia, serif;
      margin: 20px;
    }
    section {
      margin-bottom: 2rem;
      padding-bottom: 2rem;
      border-bottom: 1px solid #e0e0e0;
    }
  </style>
</head>
<body>
  <h1>DeepMind‑podcast index</h1>
  <p><em>Bestanden met een letter‑suffix (b, a) worden vóór de basis‑versie getoond.</em></p>
  <div id="content"></div>

  <script>
    /**
     * Laad index-bestanden in de volgorde:
     *   index36b.md, index36a.md, index36.md, index35.md, index34a.md, index34.md, ...
     * Het script stopt wanneer er vijf opeenvolgende nummers geen hit opleveren
     * (zodat we niet oneindig blijven loopen).
     */
    async function loadMarkdownFiles() {
      const container = document.getElementById("content");
      const suffixes = ["b", "a", ""];          // volgorde b → a → (geen)
      const suffixRank = { "b": 0, "a": 1, "": 2 };

      const items = [];
      let n = 100;                              // begin lekker hoog; pas aan naar behoefte
      let consecutiveMisses = 0;                // om een eind‑voorwaarde te hebben

      while (n >= 0 && consecutiveMisses < 5) { // max 5 gemiste nummers op rij
        let foundForN = false;

        for (const sfx of suffixes) {
          const filename = `index${n}${sfx}.md`;
          try {
            const resp = await fetch(filename);
            if (resp.ok) {
              const md = await resp.text();
              items.push({ num: n, suffix: sfx, html: marked.parse(md) });
              foundForN = true;
            }
          } catch (err) {
            // netwerkfout negeren; treated as 'not found'
          }
        }

        if (foundForN) {
          consecutiveMisses = 0;
        } else {
          consecutiveMisses++;
        }
        n--; // ga naar het volgende nummer
      }

      // sorteer: eerst nummer dalend, dan suffix volgens b → a → ''
      items.sort((a, b) => {
        if (a.num !== b.num) return b.num - a.num;
        return suffixRank[a.suffix] - suffixRank[b.suffix];
      });

      // render
      for (const itm of items) {
        const sec = document.createElement("section");
        sec.innerHTML = itm.html;
        container.appendChild(sec);
      }
    }

    loadMarkdownFiles();
  </script>
</body>
</html>
